name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.11", "3.15"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
              with:
                  python-version: ${{ matrix.python }}
            # On Windows, install make into this shell before calling it.
            - name: Test
              shell: pwsh
              run: |
                  if ($IsWindows) { ./tools/install-bash.ps1 }
                  make test
