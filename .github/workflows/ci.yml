name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.11", "3.15"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.3
              with:
                  python-version: ${{ matrix.python }}
            - run: uvx facere test
