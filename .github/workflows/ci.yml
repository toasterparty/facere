name: CI

on:
    push:
        branches: [main, "hotfix/**"]
    pull_request:
    workflow_call:

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ["3.11", "3.15"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-fac
              with:
                  python-version: ${{ matrix.python }}
            - run: fac ci

    # Outside ci-pass and releases, so a broken release can't block the release that fixes it.
    latest:
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.3
            - run: uvx facere ci

    ci-pass:
        if: always()
        needs: test
        runs-on: ubuntu-latest
        steps:
            - run: test "${{ needs.test.result }}" = success
