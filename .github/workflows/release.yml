name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
            - run: make test

    publish:
        needs: test
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10
            - run: make publish
