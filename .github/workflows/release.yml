name: Release

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Release Type
                type: choice
                required: true
                default: Patch
                options: [Major, Minor, Patch]

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup-fac
            - run: fac build_release -- "$RELEASE_TYPE"
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
            - uses: actions/upload-artifact@v7
              with:
                  name: release
                  path: build/release/
                  if-no-files-found: error

    push:
        needs: [ci, build]
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
            - uses: ./.github/actions/setup-fac
            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: build/release/
            - run: fac push_release

    publish:
        needs: push
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-fac
            - uses: actions/download-artifact@v8
              with:
                  name: release
                  path: build/release/
            - run: fac publish_release
