[project]
name = "facere"
dynamic = ["version"]
description = "A build tool configured in plain Python"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
dependencies = []

[project.scripts]
fac = "facere._cli:console_main"
facere = "facere._cli:console_main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/facere/_version.py"

[tool.hatch.build.targets.wheel.force-include]
"doc/user" = "facere/doc"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "doc", "README.md", "LICENSE", "COPYING"]

[tool.ruff]
line-length = 100
cache-dir = "build/.ruff_cache"

[tool.ruff.lint]
extend-select = ["I"]  # Sort imports.

[tool.ruff.lint.per-file-ignores]
# A fac.py declares paths as parameter defaults and writes outputs with bare open(), as doc/user/ shows.
"tests/*/test_*/**" = ["B006", "B008", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "build/test/.pytest_cache"
addopts = ["--strict-markers", "-n", "auto"]

[tool.ty.src]
include = ["src", "tests", "examples"]
